name: Flc 0.8.98 packages
on:
  push:
    branches: [codex/0.8.98-flc]
    paths: ['lib/**', 'android/**', 'pubspec.yaml', 'pubspec.lock']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flc-0.8.98
  cancel-in-progress: false
env:
  FLUTTER_VERSION: '3.47.1'
  GO_VERSION: '1.26.4'
  NDK_VERSION: r28c
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - name: Regression tests
        run: |
          yq -i '.hooks.user_defines.setup.build_assets = false | .hooks.user_defines.rust_api.build_assets = false' pubspec.yaml
          flutter test test/widgets/update_dialog_test.dart test/providers/common_action_test.dart test/widgets/views_smoke_test.dart test/state_run_globals_test.dart test/common/task_test.dart
  build:
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: android, os: ubuntu-24.04, arch: all}
          - {platform: windows, os: windows-2022, arch: amd64}
          - {platform: windows, os: windows-11-arm, arch: arm64}
          - {platform: linux, os: ubuntu-22.04, arch: amd64}
          - {platform: linux, os: ubuntu-24.04-arm, arch: arm64}
          - {platform: macos, os: macos-15-intel, arch: amd64}
          - {platform: macos, os: macos-latest, arch: arm64}
    steps:
      - name: Enable long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/helper
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: nttld/setup-ndk@v1
        if: matrix.platform == 'android'
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true
      - uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build official package formats
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          FLCLASH_UNSIGNED_RELEASE: 'true'
        run: dart setup.dart ${{ matrix.platform }} --env stable -v
      - name: Verify DMG integrity
        if: matrix.platform == 'macos'
        run: find dist -name '*.dmg' -exec hdiutil verify {} \;
      - name: Record checksums and source
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib, os, pathlib, zipfile
          root = pathlib.Path('dist')
          files = sorted(p for p in root.rglob('*') if p.is_file())
          expected = {'android': 3, 'windows': 2, 'macos': 1, 'linux': 3}
          assert len(files) == expected[os.environ['PLATFORM']], 'Unexpected package count'
          for p in files:
              if p.suffix == '.zip':
                  with zipfile.ZipFile(p) as archive:
                      assert archive.testzip() is None
          (root / 'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + str(p.relative_to(root)) + '\n' for p in files))
          (root / 'SOURCE_COMMIT.txt').write_text(os.environ['SOURCE_SHA'] + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: FlClash-0.8.98-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.platform == 'android' && '-UNSIGNED' || '' }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
